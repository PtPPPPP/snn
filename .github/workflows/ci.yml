name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test ai-node
        run: npm run test:ai-node

      - name: Test ai conversation state
        run: npm run test:ai-state

      - name: Test ai-gateway
        run: npm run test:ai-gateway

      - name: Production build
        run: npm run build

      - name: Validate build artifact
        run: npm run test:artifact

      - name: Test rendered pages
        run: npm run test:pages
