name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test ai-node
        run: npm run test:ai-node

      - name: Test ai conversation state
        run: npm run test:ai-state

      - name: Test ai-gateway
        run: npm run test:ai-gateway

      - name: Production build
        run: npm run build

      - name: Validate build artifact
        run: npm run test:artifact

      - name: Test production readiness rules
        run: npm run test:production-readiness

      - name: Test rendered HTML
        run: npm run test:rendered-html

  dsh-workspace-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PtPPPPP/deepseek-harness
          ref: 852ae5321a3d68bc0b11c5cc6f3145dde6530500
          path: deepseek-harness

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Build pinned DSH runtime
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Keep the built DSH dependency tree outside this checkout before npm ci
      # creates SNN's node_modules. The two projects intentionally pin different
      # React type trees and must not see or prune one another.
      - name: Isolate pinned DSH runtime
        run: mv deepseek-harness "${RUNNER_TEMP}/snn-pinned-dsh"

      # DSH is checked out inside this repository. Build it before installing
      # SNN dependencies so TypeScript cannot walk to the parent node_modules
      # and mix SNN's React 19 types with DSH's locked React 18 types.
      - name: Install SNN dependencies
        run: npm ci

      # The browser acceptance serves the verified Worker/React build from
      # dist/server and dist/client; a clean runner has no pre-existing dist.
      - name: Build SNN browser fixture
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run pinned DSH workspace editing acceptance
        env:
          SNN_DSH_ROOT: ${{ runner.temp }}/snn-pinned-dsh
        run: npx playwright test tests/workspace-edit-e2e.spec.mjs --workers=1 --reporter=github
